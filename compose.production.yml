name: meduc-php

services:
  db:
    image: mariadb:10.11
    container_name: meduc_php_db
    restart: unless-stopped
    command: --max_allowed_packet=512M --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-strict-mode=0 --innodb-default-row-format=DYNAMIC
    environment:
      MARIADB_ROOT_PASSWORD: ${MEDUC_DB_ROOT_PASSWORD:?Set MEDUC_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MEDUC_DB_NAME:?Set MEDUC_DB_NAME}
      MARIADB_USER: ${MEDUC_DB_USER:?Set MEDUC_DB_USER}
      MARIADB_PASSWORD: ${MEDUC_DB_PASSWORD:?Set MEDUC_DB_PASSWORD}
    volumes:
      - meduc_php_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    build: .
    container_name: meduc_php_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    environment:
      DB_HOST: db
      DB_NAME: ${MEDUC_DB_NAME:?Set MEDUC_DB_NAME}
      DB_USERNAME: ${MEDUC_DB_USER:?Set MEDUC_DB_USER}
      DB_PASSWORD: ${MEDUC_DB_PASSWORD:?Set MEDUC_DB_PASSWORD}
      SECURITY_SALT: ${MEDUC_SECURITY_SALT:?Set MEDUC_SECURITY_SALT}
      MEDUC_UPLOAD_KEY: ${MEDUC_UPLOAD_KEY:?Set MEDUC_UPLOAD_KEY}
      AZURE_TRANSLATOR_KEYS: ${AZURE_TRANSLATOR_KEYS:-}
      SLACK_FEEDBACK_WEBHOOK_URL: ${SLACK_FEEDBACK_WEBHOOK_URL:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
      APP_DEBUG: "false"
      MEDUC_TRUST_PROXY_HTTPS: "true"
      MEDUC_2033_API_BASE: ${MEDUC_2033_API_BASE:-https://meduc.duckdns.org/api/2033}
      MEDUC_2033_API_KEY: ${MEDUC_2033_API_KEY:-}
    volumes:
      - ./:/var/www/html
      - /opt/meduc-php/secrets/google-service-account.json:/run/secrets/google-service-account.json:ro

volumes:
  meduc_php_db_data:
